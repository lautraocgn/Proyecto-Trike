name: Build V8.3 Retry

on:
  push:
    paths:
      - '.github/workflows/build-v83b.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reuse V8.3 generator
        shell: bash
        run: |
          awk '
            /^          python3 <<'"'"'PY'"'"'$/ { inside=1; next }
            /^          PY$/ { inside=0; exit }
            inside { sub(/^          /, ""); print }
          ' .github/workflows/build-v83.yml > /tmp/generate_v83.py
          python3 /tmp/generate_v83.py

      - name: Fix generated parser scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Proyecto_trike_v8_3.ino')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'if (modoAprendizajeActivo) {\n          estadoActual = MODO_APRENDIZAJE;\n        } else if (estadoActual != ERROR_GRAVE) {',
              'if (digitalRead(PIN_BTN_MODO) == LOW) {\n          estadoActual = MODO_APRENDIZAJE;\n        } else if (estadoActual != ERROR_GRAVE) {',
              1
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Compile V8.3
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          export PATH="$PATH:$HOME/bin"
          arduino-cli config init --overwrite
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:uno Proyecto_trike_v8_3.ino

      - name: Commit V8.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Proyecto_trike_v8_3.ino
          git commit -m "v8.3 - Interfaz de pruebas serie y calibracion"
          git push
