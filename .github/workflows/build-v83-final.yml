name: Build V8.3 Final

on:
  push:
    paths:
      - 'tools/generate_v83.py'
      - 'Proyecto_trike_v8.ino'
      - '.github/workflows/build-v83-final.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate V8.3
        run: python3 tools/generate_v83.py

      - name: Setup Arduino CLI
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Install AVR core
        shell: bash
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile V8.3
        shell: bash
        run: |
          mkdir -p /tmp/Proyecto_trike_v8_3
          cp Proyecto_trike_v8_3.ino /tmp/Proyecto_trike_v8_3/Proyecto_trike_v8_3.ino
          arduino-cli compile --fqbn arduino:avr:uno /tmp/Proyecto_trike_v8_3

      - name: Commit V8.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Proyecto_trike_v8_3.ino
          if git diff --cached --quiet; then
            echo "No hay cambios en V8.3"
          else
            git commit -m "v8.3 - Interfaz de pruebas serie y calibracion [skip-v83]"
            git push
          fi

      - name: Upload V8.3
        uses: actions/upload-artifact@v4
        with:
          name: Proyecto_trike_v8_3
          path: Proyecto_trike_v8_3.ino
